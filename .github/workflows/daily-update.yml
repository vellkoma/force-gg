name: Daily Esports Update

on:
  schedule:
    - cron: '0 20 * * *'  # 毎日 05:00 JST (UTC 20:00)
  workflow_dispatch:       # 手動実行も可能

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger update on Railway
        run: |
          curl -v -X POST "${{ secrets.BACKEND_URL }}/api/esports/admin/update" \
            -H "x-update-secret: ${{ secrets.UPDATE_SECRET }}" \
            --max-time 300 \
            --fail-with-body
