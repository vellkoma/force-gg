<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Google Search Console の所有権確認用。
      検索結果からの削除リクエストを出すために必要。
      削除が完了するまでは外さないこと。
    -->
    <meta name="google-site-verification" content="kpQRcgWmLq4v9n1cafEAPnN-oF2dhBo-3sg1wZ9rs6Y" />

    <!--
      検索結果からの除外（サイト閉鎖に伴う措置）
      robots.txt でクロールを禁止すると、クローラーがこの noindex を読めず
      既存のインデックスが残り続ける。クロールは許可したまま noindex を伝える。
    -->
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="googlebot" content="noindex, nofollow, noarchive" />

    <!-- SEO -->
    <meta name="description" content="LoL stats, AI coaching, and champion insights — powered by force.gg" />
    <meta name="keywords" content="LoL, League of Legends, stats, summoner, champion, build, AI coaching" />
    <meta name="theme-color" content="#0a0e1a" />
    <meta property="og:title" content="force.gg" />
    <meta property="og:description" content="LoL stats, AI coaching, and champion insights" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="force.gg" />
    <meta name="twitter:description" content="LoL stats, AI coaching, and champion insights" />

    <!-- Google Fonts: Noto Sans JP + Rajdhani -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Rajdhani:wght@600;700&display=swap"
      rel="stylesheet"
    />

    <title>force.gg — LoL Stats & AI Coaching</title>

    <!--
      Google AdSense
      サイト確認・広告配信に必要。id は AdBanner の重複挿入ガードと合わせてあるため、
      変更するとスクリプトが二重に読み込まれる。publisher ID は公開情報。
    -->
    <script
      id="adsense-script"
      async
      crossorigin="anonymous"
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5566337236004544"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
